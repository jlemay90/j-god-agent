name: Pattern Investigator isolated checks

on:
  pull_request:
    paths:
      - 'pattern_investigator/**'
      - 'tests/test_pattern_*.py'
      - '.github/workflows/pattern-investigator-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline Python integration, security, and regression checks
        run: python -m unittest discover -s tests -p 'test_pattern_*.py' -v
      - name: Isolated private Site evidence route negative-auth checks
        run: node --test pattern_investigator/test_site_evidence_route.mjs
      - name: Syntax compile
        run: python -m compileall -q pattern_investigator
