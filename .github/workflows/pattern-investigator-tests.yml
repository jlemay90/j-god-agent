name: Pattern Investigator isolated checks

on:
  pull_request:
    paths:
      - 'pattern_investigator/**'
      - 'tests/test_pattern_investigator.py'
      - '.github/workflows/pattern-investigator-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline unit and CLI tests
        run: python -m unittest discover -s tests -p test_pattern_investigator.py -v
      - name: Syntax compile
        run: python -m compileall -q pattern_investigator
