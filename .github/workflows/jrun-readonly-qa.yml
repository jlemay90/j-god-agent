name: J RUN isolated read-only QA

on:
  pull_request:
    paths:
      - 'run_controller/**'
      - 'tests/test_run_controller.py'
      - 'tests/test_gemini_readonly.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing controller regression
        run: python -m unittest discover -s tests -p 'test_run_controller.py' -v
      - name: New read-only Gemini regression (mocked; no credentials)
        run: python -m unittest discover -s tests -p 'test_gemini*.py' -v
