name: Zeus private Hub read-only link QA

on:
  pull_request:
    paths:
      - 'hub_link_probe.py'
      - 'hub_native_record_probe.py'
      - 'tests/test_hub_native_record.py'
      - 'hub-link/**'
      - 'tests/test_hub_link_probe.py'
      - 'j_runtime.py'
      - 'telegram_agent_bot.py'
      - '.github/workflows/zeus-hub-link-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-readonly-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only Sites handler and negative authorization tests
        run: node --test hub-link/test_site_probe.mjs
      - name: Zeus client and blocked-receipt tests
        run: python -m unittest discover -s tests -p 'test_hub_link_probe.py' -v
      - name: Native Sites v28 single-item read client safety tests
        run: python -m unittest discover -s tests -p 'test_hub_native_record.py' -v
      - name: Compile Zeus command routing without execution
        run: python -m compileall -q hub_link_probe.py hub_native_record_probe.py j_runtime.py telegram_agent_bot.py
